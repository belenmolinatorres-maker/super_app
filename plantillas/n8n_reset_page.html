<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña | Súper App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-white min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <div class="fixed inset-0 flex items-center justify-center opacity-[0.05] pointer-events-none z-0">
        <img src="https://ideasypruebas2.es/cursos/IFCT0211/Belen/logo_gestion.png" alt="Watermark" class="w-[500px] grayscale">
    </div>

    <div class="relative z-10 w-full max-w-md bg-white rounded-3xl shadow-2xl border border-slate-100 overflow-hidden">
        <div class="p-8">
            <div class="text-center mb-8">
                <h2 class="text-2xl font-extrabold text-slate-900 tracking-tight">Nueva Contraseña</h2>
                <p class="text-slate-500 text-sm mt-2">Crea una clave segura para recuperar tu acceso</p>
            </div>

            <div id="alertContainer" class="hidden mb-6 p-4 rounded-xl border flex items-center gap-3 text-sm">
                <i id="alertIcon" class="fas"></i>
                <p id="alertMessage" class="font-medium"></p>
            </div>

            <form id="resetForm" class="space-y-6">
                <div>
                    <label for="nueva_contraseya" class="block text-sm font-semibold text-slate-700 mb-2">Nueva Contraseña</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400">
                            <i class="fas fa-lock"></i>
                        </span>
                        <input type="password" id="nueva_contraseya" name="nueva_contraseya" required
                            class="block w-full pl-11 pr-4 py-3.5 border border-slate-200 rounded-2xl bg-slate-50 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all text-sm"
                            placeholder="Mínimo 6 caracteres">
                    </div>
                </div>

                <div>
                    <label for="confirmar_contraseya" class="block text-sm font-semibold text-slate-700 mb-2">Confirmar Contraseña</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400">
                            <i class="fas fa-shield-alt"></i>
                        </span>
                        <input type="password" id="confirmar_contraseya" name="confirmar_contraseya" required
                            class="block w-full pl-11 pr-4 py-3.5 border border-slate-200 rounded-2xl bg-slate-50 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all text-sm"
                            placeholder="Repite tu contraseña">
                    </div>
                </div>

                <button type="submit" id="submitBtn"
                    class="w-full flex justify-center py-4 px-4 border border-transparent rounded-2xl shadow-lg text-sm font-bold text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition duration-150 transform hover:scale-[1.02] active:scale-[0.98]">
                    <span id="btnText">Actualizar Contraseña</span>
                    <span id="btnLoader" class="hidden">
                        <i class="fas fa-circle-notch animate-spin"></i>
                    </span>
                </button>
            </form>
        </div>

        <div class="bg-slate-50 px-8 py-4 text-center border-t border-slate-100">
            <p class="text-[10px] text-slate-400 uppercase tracking-[0.2em] font-bold">
                © 2026 Gestión de Sistemas • Todos los derechos reservados
            </p>
        </div>
    </div>

    <div id="statusModal" class="hidden fixed inset-0 z-[60] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
        <div class="bg-white rounded-3xl shadow-2xl p-8 max-w-sm w-full text-center border border-slate-100">
            <div class="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fas fa-check text-2xl"></i>
            </div>
            <h3 class="text-xl font-bold text-slate-900 mb-2">¡Todo listo!</h3>
            <p class="text-slate-500 text-sm mb-6">Tu contraseña ha sido actualizada correctamente. Serás redirigido al acceso en unos segundos.</p>
            <button onclick="window.close()" class="w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-2xl transition-all text-sm shadow-xl transform hover:scale-[1.02] active:scale-[0.98]">
                Cerrar
            </button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var urlParams = new URLSearchParams(window.location.search);
            var userId = urlParams.get('id');

            if (!userId || userId.trim() === '') {
                document.getElementById('alertContainer').classList.remove('hidden');
                alertMessage.textContent = 'Enlace inválido o caducado. Solicita un nuevo restablecimiento.';
                document.getElementById('resetForm').classList.add('hidden');
                return;
            }

            var resetForm = document.getElementById('resetForm');
            var alertContainer = document.getElementById('alertContainer');
            var alertMessage = document.getElementById('alertMessage');
            var alertIcon = document.getElementById('alertIcon');
            var submitBtn = document.getElementById('submitBtn');
            var btnLoader = document.getElementById('btnLoader');
            var btnText = document.getElementById('btnText');
            var statusModal = document.getElementById('statusModal');

            resetForm.addEventListener('submit', async function (e) {
                e.preventDefault();
                hideAlert();

                var nuevaContraseya = document.getElementById('nueva_contraseya').value;
                var confirmarContraseya = document.getElementById('confirmar_contraseya').value;

                if (nuevaContraseya.length < 6) {
                    showAlert('La contraseña debe tener al menos 6 caracteres.', 'error');
                    return;
                }
                if (nuevaContraseya !== confirmarContraseya) {
                    showAlert('Las contraseñas no coinciden.', 'error');
                    return;
                }

                setLoading(true);

                try {
                    var response = await fetch('https://n8n.misappsfantasticas.cloud/webhook/resetear', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            id_usuario: userId,
                            contraseya: nuevaContraseya
                        })
                    });

                    if (!response.ok) {
                        throw new Error('Error en la comunicación con el servidor');
                    }

                    var rawData = await response.json();
                    var data = Array.isArray(rawData) ? rawData[0] : rawData;

                    if (data.codigo === 1 || data.codigo === '1') {
                        if (statusModal) {
                            statusModal.classList.remove('hidden');
                        } else {
                            showAlert('¡Contraseña actualizada! Redirigiendo...', 'success');
                        }
                        // No redirigimos — el dominio del sitio está en mantenimiento
                    } else {
                        showAlert(data.mensaje || 'Error al actualizar la contraseña.', 'error');
                    }

                } catch (error) {
                    console.error('Fetch Error:', error);
                    showAlert('No se pudo conectar con el servidor. Verifica tu conexión.', 'error');
                } finally {
                    setLoading(false);
                }
            });

            function showAlert(msg, type) {
                if (!alertContainer) return;
                alertMessage.textContent = msg;
                alertContainer.classList.remove('hidden', 'bg-red-50', 'border-red-200', 'text-red-700', 'bg-green-50', 'border-green-200', 'text-green-700');
                if (type === 'error') {
                    alertContainer.classList.add('bg-red-50', 'border-red-200', 'text-red-700');
                    if (alertIcon) alertIcon.className = 'fas fa-exclamation-circle text-red-500';
                } else {
                    alertContainer.classList.add('bg-green-50', 'border-green-200', 'text-green-700');
                    if (alertIcon) alertIcon.className = 'fas fa-check-circle text-green-500';
                }
            }

            function hideAlert() {
                if (alertContainer) alertContainer.classList.add('hidden');
            }

            function setLoading(isLoading) {
                if (!submitBtn) return;
                submitBtn.disabled = isLoading;
                if (isLoading) {
                    if (btnLoader) btnLoader.classList.remove('hidden');
                    if (btnText) btnText.classList.add('hidden');
                    submitBtn.classList.add('opacity-75', 'cursor-not-allowed');
                } else {
                    if (btnLoader) btnLoader.classList.add('hidden');
                    if (btnText) btnText.classList.remove('hidden');
                    submitBtn.classList.remove('opacity-75', 'cursor-not-allowed');
                }
            }
        });
    </script>
</body>
</html>
