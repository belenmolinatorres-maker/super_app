<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Súper App | Acceso al Ecosistema</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .hidden { display: none !important; }
    </style>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">
    
    <div class="w-full max-w-md">
        
        <!-- SECCIÓN DE LOGIN -->
        <div id="loginSection" class="bg-white rounded-2xl shadow-2xl overflow-hidden">
            <div class="p-8">
                <div class="text-center mb-4">
                    <img src="https://ideasypruebas2.es/cursos/IFCT0211/Belen/logo_gestion.png" 
                         alt="Logo Gestión" 
                         class="mx-auto h-40 w-auto block mb-4">
                    <p class="text-slate-500 text-sm">Ingresa tus credenciales para continuar</p>
                </div>

                <!-- Alerta de Error -->
                <div id="errorAlert" class="hidden mb-6 p-4 rounded-lg bg-red-50 border border-red-200 flex items-center gap-3">
                    <i class="fas fa-exclamation-circle text-red-500"></i>
                    <p id="errorMessage" class="text-sm text-red-700"></p>
                </div>

                <form id="loginForm" class="space-y-6">
                    <div>
                        <label for="usuario" class="block text-sm font-semibold text-slate-700 mb-2">Usuario</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
                                <i class="fas fa-user"></i>
                            </span>
                            <input type="text" id="usuario" name="usuario" required
                                class="block w-full pl-10 pr-3 py-3 border border-slate-300 rounded-xl leading-5 bg-slate-50 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition duration-150 sm:text-sm"
                                placeholder="Tu nombre de usuario">
                        </div>
                    </div>

                    <div>
                        <label for="contraseya" class="block text-sm font-semibold text-slate-700 mb-2">Contraseña</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
                                <i class="fas fa-lock"></i>
                            </span>
                            <input type="password" id="contraseya" name="contraseya" required
                                class="block w-full pl-10 pr-3 py-3 border border-slate-300 rounded-xl leading-5 bg-slate-50 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition duration-150 sm:text-sm"
                                placeholder="••••••••">
                        </div>
                    </div>

                    <div class="flex items-center justify-between">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="checkbox" id="recordar" name="recordar"
                                class="w-4 h-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500">
                            <span class="text-sm text-slate-600">Recordarme</span>
                        </label>
                        <button type="button" onclick="window.handleForgotPassword()" class="text-sm font-medium text-indigo-600 hover:text-indigo-500">
                            ¿Olvidaste tu contraseña?
                        </button>
                    </div>

                    <button type="submit" id="submitBtnLogin"
                        class="w-full flex justify-center py-3 px-4 border border-transparent rounded-xl shadow-sm text-sm font-bold text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition duration-150 transform hover:scale-[1.02]">
                        <span id="btnText">Iniciar Sesión</span>
                        <span id="btnLoader" class="hidden">
                            <i class="fas fa-circle-notch animate-spin"></i>
                        </span>
                    </button>
                </form>
            </div>
            
            <div class="bg-slate-50 px-8 py-4 text-center border-t border-slate-100">
                <p class="text-[10px] text-slate-400 uppercase tracking-[0.2em] font-bold">
                    © 2026 Gestión de Sistemas • Todos los derechos reservados
                </p>
            </div>
        </div>

        <!-- SECCIÓN DE RESET (Oculta por defecto) -->
        <div id="resetSection" class="hidden bg-white rounded-2xl shadow-2xl overflow-hidden">
            <div class="p-8">
                <div class="text-center mb-8">
                    <img src="https://ideasypruebas2.es/cursos/IFCT0211/Belen/logo_gestion.png" 
                         alt="Logo Gestión" 
                         class="mx-auto h-40 w-auto block mb-4">
                    <h2 class="text-2xl font-extrabold text-slate-900 tracking-tight">Nueva Contraseña</h2>
                    <p class="text-slate-500 text-sm mt-2">Crea una clave segura para recuperar tu acceso</p>
                </div>

                <!-- Alerta de Error Reset -->
                <div id="resetErrorAlert" class="hidden mb-6 p-4 rounded-xl border border-red-200 bg-red-50 flex items-center gap-3 text-sm text-red-700">
                    <i class="fas fa-exclamation-circle text-red-500"></i>
                    <p id="resetErrorMessage" class="font-medium"></p>
                </div>

                <form id="resetForm" class="space-y-6">
                    <div>
                        <label for="nueva_contraseya" class="block text-sm font-semibold text-slate-700 mb-2">Nueva Contraseña</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
                                <i class="fas fa-lock"></i>
                            </span>
                            <input type="password" id="nueva_contraseya" name="nueva_contraseya" required
                                class="block w-full pl-10 pr-4 py-3.5 border border-slate-200 rounded-2xl bg-slate-50 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all text-sm"
                                placeholder="Mínimo 6 caracteres">
                        </div>
                    </div>

                    <div>
                        <label for="confirmar_contraseya" class="block text-sm font-semibold text-slate-700 mb-2">Confirmar Contraseña</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
                                <i class="fas fa-shield-alt"></i>
                            </span>
                            <input type="password" id="confirmar_contraseya" name="confirmar_contraseya" required
                                class="block w-full pl-10 pr-4 py-3.5 border border-slate-200 rounded-2xl bg-slate-50 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all text-sm"
                                placeholder="Repite tu contraseña">
                        </div>
                    </div>

                    <button type="submit" id="submitBtn"
                        class="w-full flex justify-center py-4 px-4 border border-transparent rounded-2xl shadow-lg text-sm font-bold text-white bg-indigo-600 hover:bg-indigo-700 transition duration-150 transform hover:scale-[1.02] active:scale-[0.98]">
                        <span id="resetBtnText">Actualizar Contraseña</span>
                        <span id="resetBtnLoader" class="hidden">
                            <i class="fas fa-circle-notch animate-spin"></i>
                        </span>
                    </button>

                    <button type="button" onclick="window.location.href='index.html'" class="w-full text-center text-xs text-slate-400 hover:text-slate-600 font-bold uppercase tracking-widest mt-4">
                        Cancelar y Volver
                    </button>
                </form>
            </div>
            <div class="bg-slate-50 px-8 py-4 text-center border-t border-slate-100">
                <p class="text-[10px] text-slate-400 uppercase tracking-[0.2em] font-bold">
                    © 2026 Gestión de Sistemas • Seguridad Privada
                </p>
            </div>
        </div>

    </div>

    <!-- Modal de Recuperación de Email -->
    <div id="recoveryModal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
        <div class="relative w-full max-w-md bg-white rounded-3xl shadow-2xl border border-slate-100 overflow-hidden">
            <div class="relative z-10 p-8">
                <div class="text-center mb-8">
                    <h3 class="text-2xl font-extrabold text-slate-900">Recuperar Acceso</h3>
                    <p class="text-slate-500 text-sm mt-2">Enviáremos un enlace seguro a tu email</p>
                </div>
                <div class="space-y-6">
                    <div>
                        <label for="recoveryEmail" class="block text-sm font-semibold text-slate-700 mb-2">Correo Electrónico</label>
                        <input type="email" id="recoveryEmail" class="block w-full px-4 py-3.5 border border-slate-200 rounded-2xl bg-slate-50" placeholder="ejemplo@empresa.com">
                    </div>
                    <div class="flex flex-col gap-3">
                        <button id="sendRecoveryBtn" class="w-full py-4 bg-indigo-600 text-white font-bold rounded-2xl">Enviar Instrucciones</button>
                        <button onclick="window.closeRecoveryModal()" class="w-full py-3 text-slate-500 font-bold">Cancelar</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Estado -->
    <div id="statusModal" class="hidden fixed inset-0 z-[60] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
        <div class="relative w-full max-w-sm bg-white rounded-3xl shadow-2xl border border-slate-100 p-8 text-center">
            <div id="statusIconContainer" class="inline-flex items-center justify-center w-20 h-20 rounded-full mb-6">
                <i id="statusIcon" class="fas text-3xl"></i>
            </div>
            <h3 id="statusTitle" class="text-2xl font-extrabold text-slate-900 mb-2"></h3>
            <p id="statusDescription" class="text-slate-500 text-sm mb-8"></p>
            <button onclick="window.closeStatusModal()" class="w-full py-4 bg-indigo-600 text-white font-bold rounded-2xl">Entendido</button>
        </div>
    </div>

    <script src="assets/js/auth.js"></script>
    <script>
        /**
         * LÓGICA DINÁMICA: LOGIN vs RESET
         */
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const userId = urlParams.get('id');

            // Si hay ID en la URL, activamos modo Reset
            if (userId && userId.trim() !== "") {
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('resetSection').classList.remove('hidden');
                
                initResetLogic(userId);
            }

            function initResetLogic(uid) {
                const resetForm = document.getElementById('resetForm');
                const submitBtn = document.getElementById('submitBtn');
                const btnText = document.getElementById('resetBtnText');
                const btnLoader = document.getElementById('resetBtnLoader');
                const errorAlert = document.getElementById('resetErrorAlert');
                const errorMessage = document.getElementById('resetErrorMessage');

                resetForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    
                    const pass = document.getElementById('nueva_contraseya').value;
                    const confirm = document.getElementById('confirmar_contraseya').value;

                    // Validaciones
                    if (pass.length < 6) {
                        showResetError("La contraseña debe tener al menos 6 caracteres.");
                        return;
                    }
                    if (pass !== confirm) {
                        showResetError("Las contraseñas no coinciden.");
                        return;
                    }

                    setResetLoading(true);
                    hideResetError();

                    try {
                        const response = await fetch('/api/resetear', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                id_usuario: uid,
                                contraseya: pass
                            })
                        });

                        const data = await response.json();

                        if (data.codigo == 1 || data.codigo == "1") {
                            if (window.showStatusModal) {
                                window.showStatusModal('¡Listo!', 'Tu contraseña ha sido actualizada.', 'success');
                                setTimeout(() => window.location.href = 'index.html', 3000);
                            } else {
                                alert("Contraseña actualizada con éxito.");
                                window.location.href = 'index.html';
                            }
                        } else {
                            showResetError(data.mensaje || "Error al actualizar.");
                        }
                    } catch (err) {
                        showResetError("No se pudo conectar con el servidor.");
                        console.error(err);
                    } finally {
                        setResetLoading(false);
                    }
                });

                function showResetError(msg) {
                    errorMessage.textContent = msg;
                    errorAlert.classList.remove('hidden');
                }

                function hideResetError() {
                    errorAlert.classList.add('hidden');
                }

                function setResetLoading(isLoading) {
                    submitBtn.disabled = isLoading;
                    if (isLoading) {
                        btnText.classList.add('hidden');
                        btnLoader.classList.remove('hidden');
                    } else {
                        btnText.classList.remove('hidden');
                        btnLoader.classList.add('hidden');
                    }
                }
            }
        });
    </script>
</body>
</html>
