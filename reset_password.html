<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña | Súper App</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-white min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
    
    <!-- Marca de agua de fondo -->
    <div class="fixed inset-0 flex items-center justify-center opacity-[0.05] pointer-events-none z-0">
        <img src="https://ideasypruebas2.es/cursos/IFCT0211/Belen/logo_gestion.png" alt="Watermark" class="w-[500px] grayscale">
    </div>

    <!-- Contenedor del Formulario -->
    <div class="relative z-10 w-full max-w-md bg-white rounded-3xl shadow-2xl border border-slate-100 overflow-hidden">
        <div class="p-8">
            <div class="text-center mb-8">
                <h2 class="text-2xl font-extrabold text-slate-900 tracking-tight">Nueva Contraseña</h2>
                <p class="text-slate-500 text-sm mt-2">Crea una clave segura para recuperar tu acceso</p>
            </div>

            <!-- Alerta de Estado Dinámica -->
            <div id="alertContainer" class="hidden mb-6 p-4 rounded-xl border flex items-center gap-3 text-sm">
                <i id="alertIcon" class="fas"></i>
                <p id="alertMessage" class="font-medium"></p>
            </div>

            <form id="resetForm" class="space-y-6">
                <div>
                    <label for="nueva_contraseya" class="block text-sm font-semibold text-slate-700 mb-2">Nueva Contraseña</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400">
                            <i class="fas fa-lock"></i>
                        </span>
                        <input type="password" id="nueva_contraseya" name="nueva_contraseya" required
                            class="block w-full pl-11 pr-4 py-3.5 border border-slate-200 rounded-2xl bg-slate-50 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all text-sm"
                            placeholder="Mínimo 6 caracteres">
                    </div>
                </div>

                <div>
                    <label for="confirmar_contraseya" class="block text-sm font-semibold text-slate-700 mb-2">Confirmar Contraseña</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400">
                            <i class="fas fa-shield-alt"></i>
                        </span>
                        <input type="password" id="confirmar_contraseya" name="confirmar_contraseya" required
                            class="block w-full pl-11 pr-4 py-3.5 border border-slate-200 rounded-2xl bg-slate-50 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all text-sm"
                            placeholder="Repite tu contraseña">
                    </div>
                </div>

                <button type="submit" id="submitBtn"
                    class="w-full flex justify-center py-4 px-4 border border-transparent rounded-2xl shadow-lg text-sm font-bold text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition duration-150 transform hover:scale-[1.02] active:scale-[0.98]">
                    <span id="btnText">Actualizar Contraseña</span>
                    <span id="btnLoader" class="hidden">
                        <i class="fas fa-circle-notch animate-spin"></i>
                    </span>
                </button>
            </form>
        </div>
        
        <div class="bg-slate-50 px-8 py-4 text-center border-t border-slate-100">
            <p class="text-[10px] text-slate-400 uppercase tracking-[0.2em] font-bold">
                © 2026 Gestión de Sistemas • Todos los derechos reservados
            </p>
        </div>
    </div>

    <!-- Modal de Éxito Personalizado -->
    <div id="statusModal" class="hidden fixed inset-0 z-[60] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
        <div class="bg-white rounded-3xl shadow-2xl p-8 max-w-sm w-full text-center border border-slate-100">
            <div class="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fas fa-check text-2xl"></i>
            </div>
            <h3 class="text-xl font-bold text-slate-900 mb-2">¡Todo listo!</h3>
            <p class="text-slate-500 text-sm mb-6">Tu contraseña ha sido actualizada correctamente. Serás redirigido al acceso en unos segundos.</p>
            <button onclick="window.location.href='index.html'" class="w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-2xl transition-all text-sm shadow-xl transform hover:scale-[1.02] active:scale-[0.98]">
                Entendido
            </button>
        </div>
    </div>

    <!-- Referencia absoluta al script para evitar problemas de ruta -->
    <script src="assets/js/reset.js"></script>
</body>
</html>
